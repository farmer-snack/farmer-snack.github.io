<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="face1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="face2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="face3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" opacity="0.15"/>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" stroke="url(#bg)" stroke-width="3"/>
  <!-- 3D 立方体 -->
  <!-- 顶面 -->
  <polygon points="256,90 346,140 256,190 166,140" fill="url(#face1)" opacity="0.9"/>
  <!-- 右面 -->
  <polygon points="346,140 346,280 256,330 256,190" fill="url(#face2)" opacity="0.85"/>
  <!-- 左面 -->
  <polygon points="166,140 166,280 256,330 256,190" fill="url(#face3)" opacity="0.75"/>
  <!-- 内部发光 T 字 -->
  <text x="256" y="260" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="900" fill="#fff" text-anchor="middle" dominant-baseline="central" opacity="0.95">T</text>
  <!-- 高光 -->
  <ellipse cx="220" cy="170" rx="40" ry="12" fill="rgba(255,255,255,0.15)" transform="rotate(-30 220 170)"/>
</svg>